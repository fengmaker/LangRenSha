<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S22 对局与座位复核</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#24364b;background:#f3f5f8;font:15px/1.6 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #bdcbd8;border-radius:6px;background:white;color:#24405d;padding:7px 12px}button:hover{background:#eef4fb}a{color:#1268ac}header{background:#102d4d;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}header h1{font-size:23px;margin:0}header p{margin:2px 0 0;color:#c6d7e9;font-size:13px}header a{color:#d8eaff}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:90vh}aside{border-right:1px solid #d8e1ea;background:white;padding:16px;height:calc(100vh - 100px);position:sticky;top:0;overflow:auto}aside input,aside select{width:100%;padding:8px;margin-bottom:9px;border:1px solid #cbd6e1;border-radius:6px}.game{padding:11px 9px;border:1px solid #e2e8ef;border-radius:7px;margin-bottom:8px;cursor:pointer}.game:hover,.game.active{border-color:#407fb2;background:#eaf3fc}.game strong{display:block}.game small{color:#687c8e}.badge{display:inline-block;background:#e8edf3;color:#536477;padding:1px 6px;border-radius:4px;font-size:12px}.badge.warn{background:#fff1d7;color:#8a5800}.badge.ok{background:#e4f4e9;color:#267343}main{padding:22px 26px 100px;min-width:0;max-width:1500px}.card{background:white;border:1px solid #dbe3ec;border-radius:9px;padding:19px;margin-bottom:18px}.card h2{margin:0 0 12px;font-size:19px}.card h3{font-size:16px;margin:12px 0}.muted{color:#6d7d8e;font-size:13px}.summary{white-space:pre-wrap;font-size:16px;line-height:1.9}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.metric{padding:8px 13px;border-radius:6px;background:#f0f5fa}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e5ebf1;vertical-align:top}th{background:#f2f6fa;color:#51687e;white-space:nowrap}td input,td select{width:100%;min-width:72px;padding:6px;border:1px solid #cbd6e0;border-radius:5px}td input.name{min-width:105px}.question{border:1px solid #ebcf91;border-left:4px solid #d49a27;background:#fffaf0;padding:14px;margin:10px 0;border-radius:6px}.question blockquote{margin:8px 0;padding:6px 10px;background:white;border-left:2px solid #d4deea;white-space:pre-wrap}.question textarea{width:100%;min-height:55px;border:1px solid #d2dbe6;border-radius:5px;padding:8px;margin-top:8px}.question label{display:block;margin-top:7px}.question .field{font-family:monospace;color:#8b5b0c}.question .reason{font-weight:600}.question.done{border-color:#85bd99;background:#f1faf4}.candidate{white-space:pre-wrap;font-size:13px;color:#5b6a7b}details{margin-top:12px}summary{cursor:pointer;font-weight:600;padding:7px 0}.event-known{font-weight:500;color:#243c53}.unknown-row{color:#8492a0;background:#fafbfc}.event-row td:first-child{min-width:160px}.event-row td:nth-child(2){min-width:105px}.event-row td:nth-child(3){min-width:115px}.event-row td:nth-child(4){min-width:85px}.event-row td:nth-child(5){min-width:100px}.source tr{scroll-margin-top:30px}.source-hit{outline:2px solid #da9d25;background:#fff5d9}.source td:first-child{white-space:nowrap;color:#527291;font-variant-numeric:tabular-nums}.savebar{position:fixed;bottom:0;right:0;left:285px;z-index:4;background:#ffffffee;border-top:1px solid #ccd8e4;padding:12px 25px;display:flex;gap:10px;align-items:center;box-shadow:0 -2px 8px #1329430b}.primary{background:#176caa;color:white;border-color:#176caa}.primary:hover{background:#125d94}.complete{background:#e8f4ec;border-color:#7db993;color:#226d3b}.error{color:#aa2935}.success{color:#277647}.note{width:100%;min-height:66px;border:1px solid #cbd6e0;border-radius:6px;padding:9px}.toolbar{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:10px 0}.toolbar label{display:flex;align-items:center;gap:6px}.empty{padding:30px;color:#71859a}.offline{padding:25px;background:#fff3d9;border:1px solid #ecd396;border-radius:9px}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{height:auto;position:static;max-height:300px}.savebar{left:0}main{padding:16px 10px 130px}header{padding:14px}header h1{font-size:20px}}
</style></head><body>
<header><div><h1>S22 对局与座位复核</h1><p>对照转写检查游戏经过，对照截图检查座位姓名。更正可直接保存入库。</p></div><nav><a href="/data/reports/S22_疑点推理复核.html">AI推理核查报告</a> · <a href="/data/extractions/S22/按日座位表/按日座位表.html">按日座位总表</a> · <a href="/data/games/S22/批量复核.html">批量总览</a></nav></header>
<div class="layout"><aside><input id="search" placeholder="日期、局次、版型、BVID" aria-label="搜索对局"><select id="filter"><option value="all">全部对局</option><option value="questions">有待核对项</option><option value="missing_names">姓名未齐</option><option value="pending">尚未逐句核对</option><option value="reviewed">你已确认完成</option></select><div id="queue-info" class="muted"></div><div id="games"></div></aside><main id="content"><div class="empty">正在加载对局……</div></main></div>
<div class="savebar"><button class="primary" id="save" disabled>保存更正并入库</button><button class="complete" id="finish" disabled>标记本局复核完成</button><button id="next" disabled>保存并下一局</button><span id="message" role="status" aria-live="polite"></span></div>
<script>
'use strict';
let games=[],current=null,showUnknown=false,answers={},note='',dirty=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={unknown:'文字未说明',pass:'明确空过',unavailable:'不适用',not_held:'未举行',none:'无',peaceful:'平安夜',guard:'守护',attack:'击杀',save:'使用解药',poison:'使用毒药',check:'查验',learn:'学习',shoot:'开枪',register:'上警',continued:'延续',vote:'投票',elected:'当选',deferred:'暂缓',die:'夜间出局',exile:'放逐',transfer:'移交警徽',hold:'保留警徽',self_destruct:'自爆',choose:'选择',select:'指定',exchange:'交换',verify:'验证',give_mask:'给予面具',dance:'共舞',reveal:'翻牌',duel:'决斗',dream:'梦游',good:'好人方',wolf:'狼人方',order:'发言顺序',can_shoot:'可以开枪',cannot_shoot:'不能开枪',view:'查看',forbidden:'禁止行动',trade:'交易',betray:'背叛',select_pair:'选择两人',immune:'免伤',warden_self_trade:'典狱长同决策出局',witness_attack:'证婚人接刀',suicide:'殉情'};
const factionLabels={'':'未确认',good:'好人',werewolf:'狼人',third_party:'第三方'};
function options(values,selected,display=x=>x){return values.map(v=>`<option value="${esc(v)}" ${String(v)===String(selected??'')?'selected':''}>${esc(display(v))}</option>`).join('')}
function t(ms){if(ms==null)return '未定位';let sec=Math.floor(ms/1000);return `${Math.floor(sec/3600)}:${String(Math.floor(sec/60)%60).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function seatText(n){if(n==null)return '未确认';const s=current.dossier.seats.find(s=>s.seat===Number(n));return `${n}号${s?.name?' '+s.name:''}${s?.role?' · '+s.role:''}`}
function pendingText(e){return e.text_pending_question_count??e.text_check?.question_count??0}
function status(e){if(e.state==='reviewed')return ['你已复核','ok'];if(e.state==='preserved')return ['已确认示例','ok'];if(e.text_resolved_question_count&&!pendingText(e))return ['AI疑点核查完成','ok'];if(e.text_check?.status==='no_recap')return ['未找到集中复盘','warn'];if(pendingText(e))return [`${pendingText(e)}项待核实`,'warn'];if(e.text_resolved_question_count)return ['AI疑点核查完成','ok'];if(e.text_check?.status==='text_checked')return ['文字已核对','ok'];return ['待逐句核对','']}
function renderQueue(){let needle=$('search').value.toLowerCase(),filter=$('filter').value;const shown=games.filter(e=>{if(needle&&!`${e.date} ${e.board_name} ${e.bvid} 第${e.game_number}局`.toLowerCase().includes(needle))return false;if(filter==='missing_names'&&e.named_seats===12)return false;if(filter==='questions'&&(!(pendingText(e)+(e.frame_check?.question_count||0))||e.state==='reviewed'))return false;if(filter==='pending'&&e.text_check?.status)return false;if(filter==='reviewed'&&e.state!=='reviewed')return false;return true});$('queue-info').textContent=`显示 ${shown.length}/${games.length} 局`; $('games').innerHTML=shown.map(e=>{const [text,css]=status(e);return `<div class="game ${current?.entry.bvid===e.bvid?'active':''}" data-bvid="${esc(e.bvid)}"><strong>${esc(e.date)} 第${esc(e.game_number??'?')}局</strong><span>${esc(e.board_name)}</span> <span class="badge ${css}">${esc(text)}</span><span class="badge">姓名 ${e.named_seats??0}/12</span><br><small>${esc(e.bvid)}</small></div>`}).join('')}
async function loadGames(){games=(await (await fetch('/api/games',{cache:'no-store'})).json()).items;renderQueue()}
async function loadGame(bvid){if(dirty&&!confirm('本局有未保存的更正。确定放弃这些更正并切换？'))return;$('message').textContent='正在读取……';const response=await fetch('/api/game/'+encodeURIComponent(bvid),{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error);current=data;dirty=false;answers=structuredClone(data.review.question_answers||{});note=data.review.review_note||'';location.hash=bvid;localStorage.setItem('s22_review_last_bvid',bvid);render();renderQueue();$('message').textContent='';$('save').disabled=$('finish').disabled=data.entry.state==='preserved';$('next').disabled=false}
function setSeat(n,key,value){let seat=current.dossier.seats.find(s=>s.seat===n);seat[key]=value===''?null:key==='learning_target'?Number(value):value;if(key==='role'){seat.faction=current.role_factions?.[value]??null;if(value!=='机械狼'){seat.learning_target=null;seat.learned_role=null}}dirty=true;$('message').textContent='有未保存的更正';if(key==='role')render()}
function setRoundCount(value){const count=Number(value),d=current.dossier;if(!Number.isInteger(count)||count<0||count>12)return;if(count<d.rounds.length&&!confirm('减少轮数会移除多出的夜间和白天记录，保存时会留下更正前档案。确定按转写调整？')){render();return}while(d.rounds.length<count){const r={number:d.rounds.length+1};for(const phase of ['night','day'])r[phase]=current.template[phase+'_slots'].map(spec=>{const actors=d.seats.filter(s=>s.role===spec.actor_role);return {slot:spec.code,action:'unknown',actor:actors.length===1?actors[0].seat:null,targets:[],votes:[],effects:[],result:null,start_seat:null,direction:null,random_point:null,speech_scope:null,availability:null}});d.rounds.push(r)}d.rounds.length=count;dirty=true;render();$('message').textContent='轮数已调整，等待保存'}
function eventAt(number,phase,slot){return current.dossier.rounds.find(r=>r.number===number)[phase].find(e=>e.slot===slot)}
function setEvent(number,phase,slot,key,value){const e=eventAt(number,phase,slot);if(key==='targets'){e.targets=value.trim()?value.split(/[,，、\s]+/).filter(Boolean).map(Number):[]}else if(key==='actor'||key==='start_seat'||key==='random_point'){e[key]=value===''?null:Number(value)}else{e[key]=value===''?null:value}if(key==='action'&&['unknown','pass','unavailable','none','not_held','peaceful'].includes(value)){e.targets=[];e.result=null}dirty=true; $('message').textContent='有未保存的更正';if(key==='action')render()}
function setVotes(number,phase,slot,text){const e=eventAt(number,phase,slot);let votes=[];for(const part of text.split(/[,，;；\n]+/).map(s=>s.trim()).filter(Boolean)){const match=/^(?:(\d+):)?(\d+)\s*[>→]\s*(\d+|弃票)$/.exec(part);if(!match){$('message').textContent='票型格式请用 1>7 或 2:1>弃票';return}votes.push({round:Number(match[1]||1),voter:Number(match[2]),target:match[3]==='弃票'?null:Number(match[3]),abstained:match[3]==='弃票'})}e.votes=votes;dirty=true;$('message').textContent='有未保存的票型'}
function allQuestions(review){const original=[...(review.text_review?.questions||[]).map(q=>({...q,source_kind:'text'})),...(review.frame_seats?.questions||[]).map(q=>({...q,source_kind:'frame'}))];const ids=new Set(original.map(q=>q.id));return [...original,...Object.entries(review.question_answers||{}).filter(([id,a])=>!ids.has(id)&&a.reviewer==='ai').map(([id,a])=>({id,label:'关联发现',reason:a.conclusion,source_kind:'text',start_ms:a.evidence?.[0]?.start_ms}))]}
function updateAnswer(id,key,value){dirty=true;answers[id]={...(answers[id]||{}),[key]:value}}
async function seekText(ms,quote){let rows=[...document.querySelectorAll('.source tr[data-ms]')],row;
if(ms!=null&&current.entry.source_path&&(!rows.length||Math.min(...rows.map(x=>Math.abs(Number(x.dataset.ms)-ms)))>12000)){
const source=await(await fetch('/'+current.entry.source_path)).json();
const normalized=(Array.isArray(source)?source:(source.segments||source.body||[])).map(x=>({start_ms:x.start_ms??Math.round((x.from||0)*1000),end_ms:x.end_ms??Math.round((x.to||0)*1000),text:x.text??x.content??''}));
const nearby=normalized.filter(x=>x.end_ms>=ms-20000&&x.start_ms<=ms+30000);
$('source-tbody').innerHTML=nearby.map(x=>'<tr data-ms="'+x.start_ms+'"><td>'+t(x.start_ms)+'–'+t(x.end_ms)+'</td><td>'+esc(x.text)+'</td></tr>').join('');
rows=[...document.querySelectorAll('.source tr[data-ms]')];
}
if(ms!=null&&rows.length)row=rows.reduce((best,x)=>Math.abs(Number(x.dataset.ms)-ms)<Math.abs(Number(best.dataset.ms)-ms)?x:best,rows[0]);if(!row&&quote)row=rows.find(x=>x.textContent.includes(quote.slice(0,6)));if(row){$('source-details').open=true;document.querySelectorAll('.source-hit').forEach(x=>x.classList.remove('source-hit'));row.classList.add('source-hit');row.scrollIntoView({block:'center',behavior:'smooth'})}else{$('source-details').open=true;$('source-details').scrollIntoView({behavior:'smooth'})}}
function render(){const {entry,dossier:d,review:r,template:b}=current;const tr=r.text_review;const qs=allQuestions(r);let roles=['',...new Set([...Object.keys(b.role_counts||{}),...Object.keys(b.role_pool||{}),...d.seats.map(s=>s.role).filter(Boolean)])];const actorValues=['',...d.seats.map(s=>s.seat)];const events=d.rounds.flatMap(round=>[...round.night,...round.day]);let known=events.filter(e=>e.action!=='unknown').length;let html=`<div class="card"><h2>${esc(entry.date)} 第${esc(entry.game_number??'?')}局 · ${esc(entry.board_name)}</h2><div class="muted">${esc(entry.title)} · ${esc(entry.bvid)}</div><div class="metrics"><span class="metric">身份 ${d.seats.filter(s=>s.role).length}/12</span><span class="metric">姓名 ${d.seats.filter(s=>s.name).length}/12</span><span class="metric">已知事件/状态 ${known}</span><span class="metric">待核对项 ${qs.filter(q=>!answers[q.id]?.resolved).length} · 已核实 ${qs.filter(q=>answers[q.id]?.resolved).length}</span></div><h3>文字核对结论</h3><div class="summary">${esc(tr?.summary||'本局尚未完成逐句核对；下方为已有提取结果。核对进度会在这里更新。')}</div><p class="muted">${tr?'身份与事件依据转写整理；座位姓名另见画面核对。疑点可结合原句确认。':'此处不把自动入库当作内容核对完成。'}</p></div>`;
if(Object.values(answers).some(a=>a.reviewer==='ai'))html+=`<div class="card"><h2>AI推理与结论</h2><div class="summary">${esc(r.review_note||'逐项结论见下方。')}</div><p><a href="/data/reports/S22_疑点推理复核.html">查看全部疑点的推理与原文依据</a></p></div>`;
html+=`<div class="card" id="questions"><h2>疑点核查与推理</h2>${qs.length?[...qs].sort((a,b)=>Number(!!answers[a.id]?.resolved)-Number(!!answers[b.id]?.resolved)).map(q=>`<div class="question ${answers[q.id]?.resolved?'done':''}"><div class="field">${answers[q.id]?.resolved?(answers[q.id]?.reviewer==='ai'?'AI已核实 · ':'已核对 · '):'待核实 · '}${esc(q.label||q.field)}</div><div class="reason">${esc(q.reason)}</div>${q.quote?`<blockquote>${esc(q.quote)}</blockquote>`:''}${q.context_quote?`<details><summary>同轮转写上下文</summary><blockquote>${esc(q.context_quote)}</blockquote></details>`:''}${q.candidate!==undefined?`<div class="candidate">待核候选：${esc(typeof q.candidate==='object'?JSON.stringify(q.candidate):q.candidate)}</div>`:''}${q.source_kind==='frame'?`<button type="button" onclick="document.getElementById('frame-source')?.scrollIntoView({block:'center',behavior:'smooth'})">对照姓名牌</button>`:`<button type="button" data-seek="${q.start_ms??q.context_start_ms??''}" data-quote="${esc(q.quote||'')}">定位原文 ${esc(t(q.start_ms??q.context_start_ms))}</button>`}<textarea placeholder="核对结论或更正说明（随本局保存）" oninput="updateAnswer('${q.id}','note',this.value)">${esc(answers[q.id]?.note||'')}</textarea><label><input type="checkbox" ${answers[q.id]?.resolved?'checked':''} onchange="updateAnswer('${q.id}','resolved',this.checked)"> 这一项已核对</label></div>`).join(''):`<p class="muted">${tr?'未列出明确的文字冲突；仍可检查下方未提供项。':'逐句核对尚在进行，疑点将逐项列在这里。'}</p>`}</div>`;
if(r.frame_seats){const fr=r.frame_seats,fs=fr.source||{},fp=fs.frame_path||fr.frame_path;html+=`<div class="card" id="frame-source"><h2>画面座位核对</h2>${fs.kind==='same_day_frame'?`<p>按同日固定座位复用：${esc(fs.source_date)}。每座保留实际来源截图。</p>`:''}<p class="muted">${fp?'截图来源 '+esc(fs.source_bvid||'')+' · '+t(fs.frame_time_ms??fr.frame_time_ms):'用户提供的画面'} · 画面ID与统一人名分别保留。</p>${fp?`<a href="/${esc(fp)}" target="_blank"><img src="/${esc(fp)}" loading="lazy" alt="同日座位姓名牌来源截图" style="display:block;width:100%;max-width:1100px;border-radius:7px"></a>`:''}<div class="table-wrap"><table><thead><tr><th>座位</th><th>画面ID</th><th>统一人名</th><th>来源</th></tr></thead><tbody>${(fr.seats||[]).map(x=>{const xs=x.source||{};return `<tr><td>${x.seat}号</td><td>${esc(x.visible_label||'待读清')}</td><td>${esc(x.name||'待确认')}</td><td>${xs.frame_path?`<a href="/${esc(xs.frame_path)}" target="_blank">${esc(xs.source_bvid||'来源帧')} · ${esc(t(xs.frame_time_ms))}</a>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`}
html+=`<div class="card"><h2>座位身份 · 可直接更正</h2><datalist id="roster-names">${d.roster.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="table-wrap"><table><thead><tr><th>座位</th><th>姓名</th><th>底牌身份</th><th>实际阵营</th><th>机械狼学习目标/形态</th></tr></thead><tbody>${d.seats.map(s=>`<tr><td>${s.seat}号</td><td><input class="name" list="roster-names" value="${esc(s.name)}" placeholder="待核姓名" oninput="setSeat(${s.seat},'name',this.value)"></td><td><select onchange="setSeat(${s.seat},'role',this.value)">${options(roles,s.role,v=>v||'文字未确认')}</select></td><td><select onchange="setSeat(${s.seat},'faction',this.value)">${options(['','good','werewolf','third_party'],s.faction,v=>factionLabels[v])}</select></td><td>${s.role==='机械狼'?`<select onchange="setSeat(${s.seat},'learning_target',this.value)">${options(actorValues,s.learning_target,v=>v?`${v}号`:'目标未确认')}</select><select onchange="setSeat(${s.seat},'learned_role',this.value)">${options(['',...Object.keys(b.mechanical_forms||{})],s.learned_role,v=>v||'形态未确认')}</select>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
html+=`<div class="card"><h2>逐轮事件 · 可直接更正</h2><label>本局轮数 <select onchange="setRoundCount(this.value)">${options(Array.from({length:13},(_,i)=>i),d.rounds.length,v=>v+'轮')}</select></label><div class="toolbar"><label><input type="checkbox" ${showUnknown?'checked':''} onchange="showUnknown=this.checked;render()"> 展开转写没有提供的槽位（${events.length-known}项）</label><span class="muted">未说明、明确空过和不适用分别保存。</span></div>`;
for(const round of d.rounds){for(const [phase,phaseName] of [['night','夜间'],['day','白天']]){const visible=round[phase].filter(e=>showUnknown||e.action!=='unknown');if(!visible.length&&!showUnknown)continue;html+=`<details open><summary>第${round.number}轮 · ${phaseName}</summary><div class="table-wrap"><table><thead><tr><th>事项</th><th>动作</th><th>行动者</th><th>目标座号</th><th>查验/特殊结果</th></tr></thead><tbody>`;for(const e of visible){const spec=b[phase+'_slots'].find(s=>s.code===e.slot);const args=`${round.number},'${phase}','${e.slot}'`;const voteText=e.votes.map(v=>`${v.round===1?'':v.round+':'}${v.voter}>${v.abstained?'弃票':v.target}`).join(',');html+=`<tr class="event-row ${e.action==='unknown'?'unknown-row':''}"><td>${esc(spec?.label||e.slot)}</td><td><select onchange="setEvent(${args},'action',this.value)">${options(spec?.actions||[e.action],e.action,v=>labels[v]||v)}</select></td><td><select onchange="setEvent(${args},'actor',this.value)">${options(actorValues,e.actor,v=>v?seatText(v):'未确认/集体')}</select></td><td><input value="${esc(e.targets.join(','))}" placeholder="如 1,2" oninput="setEvent(${args},'targets',this.value)"></td><td><input value="${esc(e.result)}" placeholder="无额外结果" oninput="setEvent(${args},'result',this.value)">${e.action==='vote'||e.votes.length?`<textarea class="note" placeholder="票型：1>7,2>弃票" oninput="setVotes(${args},this.value)">${esc(voteText)}</textarea>`:''}${e.slot==='speech_order'?`<select onchange="setEvent(${args},'start_seat',this.value)">${options(actorValues,e.start_seat,v=>v?`${v}号开始`:'起点未确认')}</select><select onchange="setEvent(${args},'direction',this.value)">${options(['','forward','reverse'],e.direction,v=>({'':'方向未确认',forward:'顺序',reverse:'逆序'}[v]))}</select><select onchange="setEvent(${args},'speech_scope',this.value)">${options(['','sheriff','day'],e.speech_scope,v=>({'':'范围未确认',sheriff:'警上',day:'白天'}[v]))}</select>`:''}</td></tr>`}html+='</tbody></table></div></details>'}}
if(!d.rounds.length)html+='<p class="muted">没有可靠轮次记录。问题清单保留缺口，不虚构第一夜。</p>';html+='</div>';
html+=`<div class="card"><h2>胜负与本局备注</h2><label>胜方 <select onchange="current.dossier.winner=this.value||null;dirty=true">${options(['','good','werewolf','third_party'],d.winner,v=>v?factionLabels[v]:'文字未确认')}</select></label><h3>你的本局备注</h2><textarea class="note" oninput="note=this.value;dirty=true" placeholder="复核后发现了什么、改了哪些地方……">${esc(note)}</textarea><p class="muted">“保存更正并入库”保留待复核状态；只有你点击“标记本局复核完成”才记录人工完成。</p></div><div class="card"><details id="source-details"><summary>对照原文 · ${(r.recap_segments||[]).length}段，保留原时间</summary><div class="table-wrap"><table class="source"><thead><tr><th>时间</th><th>原始转写（跨行请连读）</th></tr></thead><tbody id="source-tbody">${(r.recap_segments||[]).map(s=>`<tr data-ms="${s.start_ms}"><td>${t(s.start_ms)}–${t(s.end_ms)}</td><td>${esc(s.text)}</td></tr>`).join('')}</tbody></table></div><p><a href="/${esc(entry.output_dir)}/复盘原文.txt" target="_blank">打开复盘原文文件</a> · <a href="/${esc(entry.source_path||'')}" target="_blank">查看完整转写源文件</a></p></details><details><summary>已补充的字段与依据</summary>${(tr?.corrections||[]).map(c=>`<p><strong>${esc(c.field)}</strong> ${esc(c.reason)}${c.quote?`<blockquote>${esc(c.quote)}</blockquote>`:''}</p>`).join('')}<p class="muted">本次写回 ${tr?.changes?.length||0} 项字段；无原句支持的内容保留未确认。</p></details></div>`;
$('content').innerHTML=html;document.querySelectorAll('[data-seek]').forEach(button=>button.onclick=()=>seekText(button.dataset.seek===''?null:Number(button.dataset.seek),button.dataset.quote))}
async function save(finish=false){if(!current)return false;const qs=allQuestions(current.review);if(finish&&qs.some(q=>!answers[q.id]?.resolved)){$('message').textContent='请先处理并勾选未确认的疑点；也可以只保存更正。';return false}try{$('save').disabled=$('finish').disabled=true;$('message').className='';$('message').textContent='正在校验并保存……';const response=await fetch('/api/game/'+current.entry.bvid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_sha256:current.sha256,dossier:current.dossier,question_answers:answers,note,mark_reviewed:finish})});const data=await response.json();if(!response.ok)throw new Error(data.error);current=data;dirty=false;answers=data.review.question_answers||{};render();await loadGames();$('message').className='success';$('message').textContent=finish?'已入库，并标记本局人工复核完成。':'更正、疑点备注均已保存并入库。';return true}catch(error){$('message').className='error';$('message').textContent=error.message;return false}finally{$('save').disabled=$('finish').disabled=current?.entry.state==='preserved'}}
$('games').addEventListener('click',event=>{const game=event.target.closest('[data-bvid]');if(game)loadGame(game.dataset.bvid).catch(showError)});$('search').oninput=renderQueue;$('filter').onchange=renderQueue;$('save').onclick=()=>save(false);$('finish').onclick=()=>save(true);$('next').onclick=async()=>{if(dirty&&!(await save(false)))return;let index=games.findIndex(e=>e.bvid===current?.entry.bvid);if(index+1<games.length)loadGame(games[index+1].bvid).catch(showError)};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
function showError(error){$('message').className='error';$('message').textContent=error.message}
(async()=>{try{if(location.protocol==='file:')throw new Error('请从本地审校服务打开，才能保存更正。');await loadGames();let bvid=location.hash.slice(1)||localStorage.getItem('s22_review_last_bvid');if(!games.some(e=>e.bvid===bvid))bvid=games[0]?.bvid;if(bvid)await loadGame(bvid)}catch(error){$('content').innerHTML=`<div class="offline"><h2>打开可保存的审校入口</h2><p>${esc(error.message)}</p><p><a href="http://127.0.0.1:8766/">进入本地 S22 审校工作台</a></p><p>服务未启动时，在项目根目录执行：</p><code>.\\.venv\\Scripts\\python.exe scripts/s22_review_server.py</code><p>原有逐局复核页仍可离线查看。</p></div>`}})();
</script></body></html>
