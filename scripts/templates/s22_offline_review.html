.pre{white-space:pre-wrap;overflow-wrap:anywhere}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}.badge{display:inline-block;padding:2px 7px;border-radius:5px;background:#edf3f6;color:#516d7d;font-size:12px}.badge.good{background:#e4f3e9;color:var(--green)}.badge.issue{background:#fff0dc;color:var(--orange)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e4ebf0;vertical-align:top;text-align:left}th{background:#f2f7fa;white-space:nowrap}.event-target{min-width:140px}td .pre{max-width:500px}.unknown{color:#8b9ca7;background:#fafcfd}.field-note{min-width:150px}details{margin:9px 0}summary{cursor:pointer;font-weight:600}.decision{border:1px solid #c9dfe7;border-radius:7px;padding:12px;margin:10px 0}.decision>summary{font-size:15px}.decision .conclusion{font-size:16px;font-weight:600}.decision blockquote{margin:8px 0;padding:9px 12px;border-left:3px solid #81a9bb;background:#f1f6f8;white-space:pre-wrap}.opinion{padding:11px;background:#f6f8ef;border-radius:6px;margin-top:12px}.opinion select{margin:5px 0}.opinion textarea{min-height:62px}.source-scroll{max-height:600px;overflow:auto}.source-scroll tr{scroll-margin-top:20px}.source-scroll td:first-child{white-space:nowrap;font-size:12px;color:var(--muted)}.source-hit{background:#fff0cf;outline:2px solid #d0a24d}#message{color:var(--green)}#message.error{color:#a32e2e}.other{border-left:3px solid #9fb6c3;padding:6px 12px;margin:8px 0}.empty{padding:30px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;width:min(1150px,94vw);max-height:90vh;padding:20px;color:var(--ink)}dialog::backdrop{background:#0c243cb0}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:white;padding-bottom:10px}dialog img{max-width:100%;height:auto}dialog pre{white-space:pre-wrap;font:inherit}.help <header><div><h1>S22 最终复核 · 离线分享版</h1><p>内嵌对局、推理、全文转写及姓名牌截图；双击即可使用。</p></div><div class="actions"><button id="export" class="primary" disabled>导出我的意见</button><button id="import" disabled>导入意见</button><button id="rules" disabled>版型规则</button><button id="help">使用说明</button></div></header>
<div class="identity"><label>复核人 <input id="reviewer" maxlength="80" placeholder="填写姓名或代号" disabled></label><span id="progress" class="muted">正在读取内嵌资料……</span><span id="message" role="status" aria-live="polite"></span></div>
<div class="layout"><aside><input id="search" placeholder="日期、局次、版型、姓名、BV号" aria-label="搜索对局" disabled><select id="filter" aria-label="筛选对局" disabled><option value="all">全部149局</option><option value="ai">有AI疑点或关联发现</option><option value="unreviewed">我尚未核对</option><option value="agree">我核对无异议</option><option value="needs_change">我提出了异议</option><option value="others">他人提交了意见</option></select><div id="queue-count" class="muted"></div><div id="queue"></div></aside><main id="content"><div class="empty">正在载入完整离线资料，首次打开请稍候。</div></main></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const judgeLabels={unreviewed:'尚未核对',agree:'核对无异议',needs_change:'有异议 / 建议更正'};
const actionLabels={unknown:'原文未说明',pass:'明确空过',unavailable:'不适用',not_held:'未举行',none:'无',peaceful:'平安夜',guard:'守护',attack:'击杀',save:'解药',poison:'毒药',check:'查验',learn:'学习',shoot:'开枪',register:'上警',continued:'延续',vote:'投票',elected:'当选',deferred:'暂缓',die:'出局',exile:'放逐',transfer:'移交警徽',hold:'保留警徽',self_destruct:'自爆',choose:'选择',select:'指定',exchange:'交换',verify:'验证',give_mask:'给予面具',dance:'共舞',reveal:'翻牌',duel:'决斗',dream:'梦游',good:'好人',wolf:'狼人',order:'发言顺序',can_shoot:'可以开枪',cannot_shoot:'不能开枪',view:'查看',forbidden:'规则禁用',trade:'交易',betray:'背叛',select_pair:'选择两人',immune:'免伤',suicide:'殉情',minority_dies:'少数方共舞出局',no_skill:'无主动技能',die_after_speech:'发言后出局',not_triggered:'未触发',cancelled:'抵消',single_wolf_attack:'单狼执行击杀',witness_attack:'证婚人接刀',warden_self_trade:'典狱长同决策出局'};
const factions={good:'好人',werewolf:'狼人',third_party:'第三方'};
let data=null,state=null,current=null,storageKey='',showUnknown=false,fullSource=false,loadToken=0,lastFocus=null;
const gameCache=new Map();
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function time(ms){if(ms==null)return '未定位';const s=Math.floor(ms/1000);return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':''}
function humanBadge(j){return `<span class="badge ${j==='agree'?'good':j==='needs_change'?'issue':''}">${esc(judgeLabels[j]||judgeLabels.unreviewed)}</span>`}
function selectJudge(value,attributes){return `<select ${attributes}>${Object.entries(judgeLabels).map(([k,v])=>`<option value="${k}" ${k===(value||'unreviewed')?'selected':''}>${v}</option>`).join('')}</select>`}
function storageRead(){try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch{return null}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));message('意见已在此浏览器暂存；完成后请导出交回。')}catch{message('此浏览器无法暂存，请及时导出意见文件。',true)}updateProgress();renderQueue()}
function entryFor(bvid){return state.entries[bvid]||{status:'unreviewed',comment:'',question_opinions:{},field_opinions:{}}}
function draft(){const bvid=current.entry.bvid;if(!state.entries[bvid])state.entries[bvid]={bvid,base_sha256:current.entry.dossier_sha256,status:'unreviewed',comment:'',question_opinions:{},field_opinions:{}};state.entries[bvid].updated_at=new Date().toISOString();return state.entries[bvid]}
function updateProgress(){const entries=Object.values(state.entries);$('progress').textContent=`149局 · 原疑点298项 + 关联发现65项 · 我已核对 ${entries.filter(e=>e.status!=='unreviewed').length} 局 · 异议 ${entries.filter(e=>e.status==='needs_change').length} 局 · 已导入 ${state.imports.length} 份意见`}
function hasOther(bvid){return state.imports.some(r=>r.entries.some(e=>e.bvid===bvid))}
function renderQueue(){if(!data)return;const needle=$('search').value.trim().toLowerCase(),filter=$('filter').value;const rows=data.index.filter(e=>{const mine=entryFor(e.bvid);if(needle&&!`${e.date} 第${e.game_number}局 ${e.board_name} ${e.names} ${e.bvid}`.toLowerCase().includes(needle))return false;if(filter==='ai'&&!e.decision_count)return false;if(['unreviewed','agree','needs_change'].includes(filter)&&mine.status!==filter)return false;if(filter==='others'&&!hasOther(e.bvid))return false;return true});$('queue-count').textContent=`显示 ${rows.length}/${data.index.length} 局`;$('queue').innerHTML=rows.map(e=>`<div class="queue-item ${current?.entry.bvid===e.bvid?'active':''}" role="button" tabindex="0" data-game="${e.bvid}"><strong>${esc(e.date)} 第${esc(e.game_number)}局</strong>${esc(e.board_name)} ${e.protected?'<span class="badge">保护样例</span>':''}<br>${humanBadge(entryFor(e.bvid).status)} <span class="badge">AI发现 ${e.decision_count}</span>${hasOther(e.bvid)?'<span class="badge">有他人意见</span>':''}<br><small>${e.bvid}</small></div>`).join('')}
async function decodeGame(bvid){if(gameCache.has(bvid))return gameCache.get(bvid);const binary=atob(data.game_blobs[bvid]);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const game=JSON.parse(text);gameCache.set(bvid,game);if(gameCache.size>3)gameCache.delete(gameCache.keys().next().value);return game}
async function loadGame(bvid){if(!data.game_blobs[bvid])return;const token=++loadToken;message('正在展开本局资料……');try{const g=await decodeGame(bvid);if(token!==loadToken)return;current=g;fullSource=false;location.hash=bvid;renderGame();renderQueue();message('')}catch(e){message('本局载入失败：'+e.message,true)}}
function seat(n){if(n==null)return '未说明';const s=current.dossier.seats.find(s=>s.seat===Number(n));return `${n}号${s?.name?' '+s.name:''}${s?.role?' · '+s.role:''}`}
function fieldOpinion(path){const value=entryFor(current.entry.bvid).field_opinions[path]||'';return `<details class="field-note" ${value?'open':''}><summary>${value?'已有修改意见':'提出修改意见'}</summary><textarea data-field-note="${esc(path)}" placeholder="建议改成什么？依据原句或时间是什么？">${esc(value)}</textarea></details>`}
function evidenceHtml(ev){return `<details><summary>原文依据 · ${time(ev.start_ms)}–${time(ev.end_ms)}</summary><p class="muted pre">${esc(ev.path)}</p><blockquote>${esc(ev.quote)}</blockquote>${ev.path===current.source_path&&ev.start_ms!=null?`<button class="small" data-seek="${ev.start_ms}">定位完整转写</button>`:''}</details>`}
function decisionHtml(d){const opinion=entryFor(current.entry.bvid).question_opinions[d.id]||{},q=d.original_question;return `<details class="decision"><summary><span class="badge good">AI${d.resolved?'已核实':'待核实'}</span> ${esc(q?.label||'关联发现')} · ${esc(d.conclusion)} ${opinion.judgement?humanBadge(opinion.judgement):''}</summary>${q?`<h3>原疑点</h3><p>${esc(q.reason)}</p>${q.quote?`<blockquote>${esc(q.quote)}</blockquote>`:''}`:''}<h3>AI结论</h3><p class="conclusion">${esc(d.conclusion)}</p><p class="pre">${esc(d.reason)}</p>${(d.evidence||[]).map(evidenceHtml).join('')}<div class="opinion"><strong>我对这一项的核对意见</strong><br>${selectJudge(opinion.judgement,`data-question-judge="${esc(d.id)}"`)}<textarea data-question-note="${esc(d.id)}" placeholder="如有异议，写出建议、理由与原文时间。">${esc(opinion.comment||'')}</textarea></div></details>`}
function otherHtml(){const rows=state.imports.flatMap(r=>r.entries.filter(e=>e.bvid===current.entry.bvid).map(e=>({r,e})));if(!rows.length)return '<p class="muted">尚未导入本局的其他复核意见。</p>';return rows.map(({r,e})=>`<div class="other"><strong>${esc(r.reviewer_name||'未署名')}</strong> ${humanBadge(e.status)}<p class="pre">${esc(e.comment)}</p>${Object.entries(e.field_opinions||{}).filter(([,v])=>v).map(([k,v])=>`<p class="pre"><strong>${esc(k)}</strong>：${esc(v)}</p>`).join('')}${Object.entries(e.question_opinions||{}).map(([id,q])=>`<p class="pre"><strong>${esc(current.decisions.find(d=>d.id===id)?.conclusion||id)}</strong> ${humanBadge(q.judgement)}<br>${esc(q.comment)}</p>`).join('')}</div>`).join('')}
function renderGame(){const g=current,d=g.dossier,b=data.templates[g.entry.board],mine=entryFor(g.entry.bvid),events=d.rounds.flatMap(r=>[...r.night,...r.day]);let out=`<section class="card"><h2>${esc(g.entry.date)} 第${esc(g.entry.game_number)}局 · ${esc(g.entry.board_name)}</h2><p class="muted">${esc(g.entry.title)} · ${g.entry.bvid}</p><div class="metrics"><span class="badge">姓名 ${d.seats.filter(s=>s.name).length}/12</span><span class="badge">身份 ${d.seats.filter(s=>s.role).length}/12</span><span class="badge">${d.rounds.length}轮</span><span class="badge">胜方：${factions[d.winner]||'未确认'}</span><span class="badge good">AI发现 ${g.decisions.length} 项</span></div><div class="toolbar"><a href="https://www.bilibili.com/video/${g.entry.bvid}/" target="_blank" rel="noopener noreferrer">按需打开原视频</a><button class="small" data-action="show-source">对照全文转写</button><button class="small" data-action="next-game">下一局</button></div></section>`;
out+=`<section class="card"><h2>我对本局的复核意见</h2>${selectJudge(mine.status,'data-game-judge')}<textarea data-game-note placeholder="本局总体结论；如有问题，说明座号、轮次、建议及依据。">${esc(mine.comment)}</textarea><p class="muted">填写的意见自动暂存在此浏览器；点击顶部“导出我的意见”后，才能把结果交给其他人。</p><details><summary>已导入的他人意见</summary>${otherHtml()}</details></section>`;
out+=`<section class="card"><h2>AI推理与结论</h2><p class="pre">${esc(g.summary)}</p>${g.decisions.map(decisionHtml).join('')||'<p class="muted">本局为此前确认的保护样例，没有本轮新增AI疑点。</p>'}</section>`;
const fr=g.frame_seats;
out+=`<section class="card"><h2>座位身份</h2><p class="muted">查看姓名牌可打开内嵌原图；同日复用姓名时会显示实际来源局。</p><div class="table-scroll"><table><thead><tr><th>座位</th><th>姓名</th><th>底牌</th><th>阵营</th><th>机械学习</th><th>姓名牌</th><th>修改意见</th></tr></thead><tbody>${d.seats.map(s=>{const fs=(fr.seats||[]).find(x=>x.seat===s.seat)?.source||fr.source||{},fp=fs.frame_path||fr.frame_path;return `<tr><td>${s.seat}号</td><td>${esc(s.name||'未确认')}</td><td>${esc(s.role||'未确认')}</td><td>${factions[s.faction]||'未确认'}</td><td>${s.role==='机械狼'?esc((s.learning_target?s.learning_target+'号 → ':'')+(s.learned_role||'未确认')):'—'}</td><td>${fp&&data.images[fp]?`<button class="small" data-frame="${esc(fp)}" data-frame-title="${esc((fs.source_bvid||g.entry.bvid)+' · '+time(fs.frame_time_ms??fr.frame_time_ms))}">查看原图</button>`:'无附图'}</td><td>${fieldOpinion('seats.'+s.seat)}</td></tr>`}).join('')}</tbody></table></div></section>`;
out+=`<section class="card"><h2>逐轮事件</h2><div class="toolbar"><label><input id="show-unknown" type="checkbox" ${showUnknown?'checked':''}> 显示原文未说明的槽位（${events.filter(e=>e.action==='unknown').length}项）</label></div>`;
for(const r of d.rounds){for(const [phase,title] of [['night','夜间'],['day','白天']]){const rows=r[phase].filter(e=>showUnknown||e.action!=='unknown');if(!rows.length)continue;out+=`<details open><summary>第${r.number}轮 · ${title}</summary><div class="table-scroll"><table><thead><tr><th>事项</th><th>动作</th><th>行动者</th><th>目标 / 结果</th><th>修改意见</th></tr></thead><tbody>${rows.map(e=>{const spec=b[phase+'_slots'].find(s=>s.code===e.slot),extra=[e.result,e.votes.length?'票型：'+e.votes.map(v=>`${v.round>1?v.round+':':''}${v.voter}→${v.abstained?'弃票':v.target}`).join('，'):null,e.start_seat?'发言从'+e.start_seat+'号开始，'+({forward:'顺序',reverse:'逆序'}[e.direction]||'方向未说明'):null,e.effects.length?'技能结算：'+e.effects.map(x=>`${x.intended_target}号原目标；${x.dead_seat?x.dead_seat+'号死亡':'无确认死者'}${x.shield_actor?'；'+x.shield_actor+'号护盾':''}`).join('；'):null].filter(Boolean).join('\n');return `<tr class="${e.action==='unknown'?'unknown':''}"><td>${esc(spec?.label||e.slot)}</td><td>${esc(actionLabels[e.action]||e.action)}</td><td>${esc(e.actor?seat(e.actor):spec?.actor_role==='狼队'?'狼队':'—')}</td><td class="event-target">${e.targets.map(n=>esc(seat(n))).join('<br>')}<div class="pre">${esc(extra)}</div></td><td>${fieldOpinion(`rounds.${r.number}.${phase}.${e.slot}`)}</td></tr>`}).join('')}</tbody></table></div></details>`}}
out+=`${!d.rounds.length?'<p class="muted">未建立可靠轮次。</p>':''}<h3>胜负或轮次的修改建议</h3>${fieldOpinion('game.winner_and_rounds')}</section>`;
out+=`<section class="card"><details id="source-panel"><summary>原文与时间定位 · 复盘${g.recap_segments.length}段 / 全文${g.full_transcript.length}段</summary><div class="toolbar"><button class="small" data-action="recap-source">只看复盘</button><button class="small" data-action="full-source">查看全文</button><input id="source-search" placeholder="检索转写原文"><button class="small" data-action="download-transcript">导出全文文字</button></div><div class="muted pre">来源：${esc(g.source_path)}</div><div id="source-count" class="muted"></div><div class="source-scroll"><table><thead><tr><th>时间</th><th>转写原句（跨行请连读）</th></tr></thead><tbody id="source-rows"></tbody></table></div></details></section><p class="footer-note">资料快照 ${data.generated_at}。149局正式范围；原始转写可能存在识别误差，AI结论与个人复核意见分别展示。</p>`;
$('content').innerHTML=out;renderSource()}
function renderSource(ms=null){const needle=$('source-search')?.value.trim()||'',rows=(fullSource?current.full_transcript:current.recap_segments).filter(s=>!needle||s.text.includes(needle));$('source-count').textContent=`${fullSource?'全文':'复盘'} · 显示 ${rows.length} 段`;$('source-rows').innerHTML=rows.map((s,i)=>`<tr data-source-ms="${s.start_ms}" id="src-${i}"><td>${time(s.start_ms)}–${time(s.end_ms)}</td><td>${esc(s.text)}</td></tr>`).join('');if(ms!=null&&rows.length){let nearest=0;for(let i=1;i<rows.length;i++)if(Math.abs(rows[i].start_ms-ms)<Math.abs(rows[nearest].start_ms-ms))nearest=i;const row=$('src-'+nearest);row.classList.add('source-hit');row.scrollIntoView({block:'center'})}}
function seek(ms){fullSource=true;$('source-panel').open=true;$('source-search').value='';renderSource(ms)}
function modal(title,body){lastFocus=document.activeElement;$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal').showModal()}
function download(name,text,mime='application/json'){const url=URL.createObjectURL(new Blob([text],{type:mime})),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function useful(e){return e.status!=='unreviewed'||e.comment||Object.values(e.field_opinions||{}).some(Boolean)||Object.values(e.question_opinions||{}).some(q=>q.judgement!=='unreviewed'&&q.judgement||q.comment)}
function exportMine(){const entries=Object.values(state.entries).filter(useful);if(!entries.length)return message('请先填写至少一项复核意见。',true);if(!$('reviewer').value.trim()){$('reviewer').focus();return message('请填写复核人姓名或代号，便于汇总。',true)}state.reviewer_name=$('reviewer').value.trim();persist();const result={format:'s22-review-feedback-v1',snapshot_id:data.snapshot_id,dataset_generated_at:data.generated_at,reviewer_id:state.reviewer_id,reviewer_name:state.reviewer_name,exported_at:new Date().toISOString(),entries};download(`S22_复核意见_${state.reviewer_name.replace(/[\\/:*?"<>|]/g,'_')}_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(result,null,2));message(`已导出 ${entries.length} 局意见，请把JSON文件交回汇总。`)}
function validateFeedback(report){if(report.format!=='s22-review-feedback-v1'||report.snapshot_id!==data.snapshot_id)throw new Error('意见文件不属于此版资料，请使用同一份离线HTML核对。');if(typeof report.reviewer_id!=='string'||typeof report.reviewer_name!=='string'||!Array.isArray(report.entries)||report.entries.length>149)throw new Error('意见文件格式不完整。');const ids=new Set();for(const e of report.entries){const base=data.index.find(g=>g.bvid===e.bvid);if(!base||base.dossier_sha256!==e.base_sha256||ids.has(e.bvid)||!Object.hasOwn(judgeLabels,e.status))throw new Error('意见中的对局或资料版本不匹配。');ids.add(e.bvid);if(typeof e.comment!=='string'||!e.question_opinions||typeof e.question_opinions!=='object'||Array.isArray(e.question_opinions)||!e.field_opinions||typeof e.field_opinions!=='object'||Array.isArray(e.field_opinions))throw new Error('意见内容格式不完整。');for(const q of Object.values(e.question_opinions))if(!q||!Object.hasOwn(judgeLabels,q.judgement||'unreviewed')||typeof(q.comment||'')!=='string')throw new Error('逐项意见格式不正确。');for(const text of Object.values(e.field_opinions))if(typeof text!=='string')throw new Error('字段意见格式不正确。')}return report}
async function importFile(file){if(!file)return;if(file.size>20*1024*1024)return message('请选择导出的复核JSON文件。',true);try{const report=validateFeedback(JSON.parse(await file.text()));const old=state.imports.findIndex(x=>x.reviewer_id===report.reviewer_id);if(old>=0)state.imports[old]=report;else state.imports.push(report);persist();if(current)renderGame();modal('意见已导入',`<p>复核人：<strong>${esc(report.reviewer_name)}</strong>，共 ${report.entries.length} 局。可以逐局查看并比较意见。</p><p>如果这是你此前导出的进度，可恢复后继续填写。</p><button id="resume-import" class="primary">恢复为我的复核进度</button>`);$('resume-import').onclick=()=>{if(Object.values(state.entries).some(useful)&&!confirm('将先保留当前意见副本，再载入这份进度继续复核。确定继续？'))return;if(Object.values(state.entries).some(useful)){state.imports.push({format:'s22-review-feedback-v1',snapshot_id:data.snapshot_id,reviewer_id:uid(),reviewer_name:state.reviewer_name+'（恢复前副本）',exported_at:new Date().toISOString(),entries:clone(Object.values(state.entries))})}state.reviewer_id=report.reviewer_id;state.reviewer_name=report.reviewer_name;state.entries=Object.fromEntries(report.entries.map(e=>[e.bvid,clone(e)]));state.imports=state.imports.filter(x=>x.reviewer_id!==report.reviewer_id);$('reviewer').value=state.reviewer_name;persist();if(current)renderGame();$('modal').close();message('已恢复这份复核进度，可以继续填写。')}}catch(e){message('导入失败：'+e.message,true)}finally{$('import-file').value=''}}
function showHelp(){modal('如何共享与汇总',`<ol class="help"><li>发送这一个HTML文件给其他人，双击打开即可。文件内已包含149局对局、全部转写、363项AI推理及78张姓名牌原图。</li><li>填写姓名或代号，可用日期、版型或BV号筛选分工。对每局、AI结论、座位或逐轮事件填写意见。</li><li>填写后点击“导出我的意见”，把得到的JSON文件交回；接收人可用“导入意见”逐局比较。</li><li>意见会在当前浏览器暂存；HTML文件本身不会被改写。换设备或分享意见时，请携带导出的JSON文件。</li><li>多人各自核对，不会自动同步。本文件不会连接或改写项目数据库。</li><li>文字和截图可离线查看；音视频未内嵌，“打开原视频”按需访问哔哩哔哩。</li></ol>`)}
$('help').onclick=showHelp;$('close-modal').onclick=()=>{$('modal').close();lastFocus?.focus?.()};
$('queue').onclick=e=>{const row=e.target.closest('[data-game]');if(row)loadGame(row.dataset.game)};
$('queue').onkeydown=e=>{if(e.key==='Enter'){const row=e.target.closest('[data-game]');if(row)loadGame(row.dataset.game)}};
$('search').oninput=renderQueue;$('filter').onchange=renderQueue;
$('reviewer').oninput=()=>{state.reviewer_name=$('reviewer').value.trim();persist()};
$('export').onclick=exportMine;$('import').onclick=()=>$('import-file').click();$('import-file').onchange=e=>importFile(e.target.files[0]);
$('rules').onclick=()=>{modal('S22 版型规则与夜间顺序','<pre id="rule-text"></pre>');$('rule-text').textContent=data.rules};
$('content').addEventListener('input',e=>{const el=e.target;if(el.id==='source-search')return renderSource();if(el.matches('[data-game-note]'))draft().comment=el.value;else if(el.dataset.questionNote){const row=draft();row.question_opinions[el.dataset.questionNote]={...(row.question_opinions[el.dataset.questionNote]||{}),comment:el.value}}else if(el.dataset.fieldNote)draft().field_opinions[el.dataset.fieldNote]=el.value;else return;persist()});
$('content').addEventListener('change',e=>{const el=e.target;if(el.id==='show-unknown'){showUnknown=el.checked;renderGame();return}if(el.matches('[data-game-judge]'))draft().status=el.value;else if(el.dataset.questionJudge){const row=draft();row.question_opinions[el.dataset.questionJudge]={...(row.question_opinions[el.dataset.questionJudge]||{}),judgement:el.value}}else return;persist()});
$('content').addEventListener('click',e=>{const frame=e.target.closest('[data-frame]');if(frame){modal('姓名牌来源 · '+frame.dataset.frameTitle,'<img id="frame-image" alt="原始姓名牌截图">');$('frame-image').src=data.images[frame.dataset.frame];return}const seekButton=e.target.closest('[data-seek]');if(seekButton)return seek(Number(seekButton.dataset.seek));const action=e.target.closest('[data-action]')?.dataset.action;if(action==='next-game'){const i=data.index.findIndex(g=>g.bvid===current.entry.bvid);if(i+1<data.index.length)loadGame(data.index[i+1].bvid)}if(action==='show-source'||action==='full-source'){fullSource=true;$('source-panel').open=true;renderSource();if(action==='show-source')$('source-panel').scrollIntoView({block:'start'})}if(action==='recap-source'){fullSource=false;renderSource()}if(action==='download-transcript')download(current.entry.bvid+'_全文转写.txt',current.full_transcript.map(s=>`[${time(s.start_ms)}–${time(s.end_ms)}] ${s.text}`).join('\n'),'text/plain;charset=utf-8')});
async function boot(){try{if(typeof DecompressionStream==='undefined')throw new Error('请使用较新版本的Edge或Chrome打开此文件。');data=JSON.parse($('embedded').textContent);$('embedded').remove();if(data.format!=='s22-offline-review-v1')throw new Error('资料格式不匹配');storageKey='s22_offline_feedback_'+data.snapshot_id;state=storageRead()||{reviewer_id:uid(),reviewer_name:'',entries:{},imports:[]};$('reviewer').value=state.reviewer_name;for(const id of ['export','import','rules','reviewer','search','filter'])$(id).disabled=false;updateProgress();renderQueue();const id=location.hash.slice(1);await loadGame(data.game_blobs[id]?id:data.index[0].bvid)}catch(e){$('content').innerHTML='<div class="card"><h2>离线资料打开失败</h2><p>'+esc(e.message)+'</p></div>';message(e.message,true)}}
boot();
</script></body></html>
