Object.assign(actionLabels,{invalid_exchange:'违规交换尝试并被判离',trade_betray:'第一人交易、第二人背叛',betray_trade:'第一人背叛、第二人交易'});

let data=null,state=null,current=null,storageKey='',showUnknown=false,fullSource=false,loadToken=0,lastFocus=null;
const gameCache=new Map();
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);

function selectJudge(value,attributes){return `<select ${attributes}>${Object.entries(judgeLabels).map(([k,v])=>`<option value="${k}" ${k===(value||'unreviewed')?'selected':''}>${v}</option>`).join('')}</select>`}
function storageRead(){try{return JSON.parse(localStorage.getItem(storageKey)||'null')}catch{return null}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));message('意见已在此浏览器暂存；完成后请导出交回。')}catch{message('此浏览器无法暂存，请及时导出意见文件。',true)}updateProgress();renderQueue()}
function entryFor(bvid){return state.entries[bvid]||{status:'unreviewed',comment:'',question_opinions:{},field_opinions:{}}}
function draft(){const bvid=current.entry.bvid;if(!state.entries[bvid])state.entries[bvid]={bvid,base_sha256:current.entry.dossier_sha256,status:'unreviewed',comment:'',question_opinions:{},field_opinions:{}};state.entries[bvid].updated_at=new Date().toISOString();return state.entries[bvid]}
function updateProgress(){const entries=Object.values(state.entries),c=data.counts;$('progress').textContent=`${c.games}局 · 原疑点${c.original_questions}项 + 关联发现${c.additional_findings}项 · 我已核对 ${entries.filter(e=>e.status!=='unreviewed').length} 局 · 异议 ${entries.filter(e=>e.status==='needs_change').length} 局 · 已导入 ${state.imports.length} 份意见`}
function hasOther(bvid){return state.imports.some(r=>r.entries.some(e=>e.bvid===bvid))}
function dayNumber(day){if(day==null)return null;if(typeof day==='number')return Number.isInteger(day)&&day>0?day:null;const match=String(day).match(/(?:第\s*)?(\d+)\s*(?:天)?/);return match?Number(match[1]):null}
function dayLabel(day){const n=dayNumber(day);return n?`第${n}天`:'日序待核'}
function issueCounts(e){return {questions:Number(e.voting_question_count)||0,pending:Number(e.voting_pending_count)||0}}
function queueMatches(e,needle,filter,date,day){let counts=issueCounts(e);const term=String(needle||'').trim().toLowerCase();if(term&&!`${e.date} 第${e.game_number}局 ${e.board_name} ${e.names} ${e.bvid}`.toLowerCase().includes(term))return false;if(date&&date!=='all'&&e.date!==date)return false;if(day&&day!=='all'){const wanted=day==='unknown'?null:Number(String(day).replace(/^day-/,'')),matched=(e.voting_days||[]).filter(d=>{const n=dayNumber(d.day);return wanted==null?n==null:n===wanted});counts={questions:matched.reduce((n,d)=>n+(Number(d.question_count)||0),0),pending:matched.reduce((n,d)=>n+(Number(d.pending_count)||0),0)};if(!(counts.questions+counts.pending))return false}if(filter==='ai'&&!e.decision_count)return false;if(filter==='voting_question'&&!counts.questions)return false;if(filter==='voting_pending'&&!counts.pending)return false;if(filter==='voting_video_pending'&&!(e.voting_video_checked&&(counts.questions+counts.pending)>0))return false;if(['unreviewed','agree','needs_change'].includes(filter)&&e._mine_status!==filter)return false;if(filter==='others'&&!e._has_other)return false;return true}
function votingDateRows(){const rows=new Map,metadataDates=new Set;for(const r of data.voting_review_dates||[])if(r?.date){metadataDates.add(r.date);rows.set(r.date,{date:r.date,games:Number(r.games)||0,questions:Number(r.question_count)||0,pending:Number(r.pending_count)||0})}for(const e of data.index||[]){const date=e.date||'日期待核';if(metadataDates.has(date))continue;const r=rows.get(date)||{date,games:0,questions:0,pending:0},c=issueCounts(e);r.games++;r.questions+=c.questions;r.pending+=c.pending;rows.set(date,r)}return [...rows.values()]}
function refreshVotingFilters(){if(!data)return;const dateSelect=$('date-filter'),dateValue=dateSelect.value||'all',dates=votingDateRows();dateSelect.innerHTML='<option value="all">全部比赛日期</option>'+dates.map(r=>`<option value="${esc(r.date)}">${esc(r.date)} · ${r.games}局 · 疑问 ${r.questions} · 待复核 ${r.pending}</option>`).join('');dateSelect.value=dates.some(r=>r.date===dateValue)?dateValue:'all';const daySelect=$('day-filter'),dayValue=daySelect.value||'all',selected=dateSelect.value,max=Math.max(0,...(data.index||[]).filter(e=>selected==='all'||e.date===selected).flatMap(e=>(e.voting_days||[]).map(d=>dayNumber(d.day)||0)));daySelect.innerHTML='<option value="all">全部游戏日</option>'+Array.from({length:max},(_,i)=>`<option value="day-${i+1}">第${i+1}天</option>`).join('')+'<option value="unknown">日序待核</option>';daySelect.value=[...daySelect.options].some(o=>o.value===dayValue)?dayValue:'all'}
function queueIssueDays(e){return (e.voting_days||[]).filter(d=>(Number(d.question_count)||0)+(Number(d.pending_count)||0)>0).map(d=>`${dayLabel(d.day)} 疑问${Number(d.question_count)||0} / 待复核${Number(d.pending_count)||0}`)}
function renderQueue(){if(!data)return;const needle=$('search').value.trim().toLowerCase(),filter=$('filter').value,date=$('date-filter').value,day=$('day-filter').value,records=data.index.map(e=>({...e,_mine_status:entryFor(e.bvid).status,_has_other:hasOther(e.bvid)})),rows=records.filter(e=>queueMatches(e,needle,filter,date,day)),dates=votingDateRows(),dateStats=new Map(dates.map(r=>[r.date,r])),groups=new Map;for(const e of rows){const key=e.date||'日期待核';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}$('queue-count').textContent=`显示 ${rows.length}/${data.index.length} 局 · ${groups.size} 个比赛日期`;$('queue').innerHTML=[...groups].map(([dateKey,items])=>{const stats=dateStats.get(dateKey)||{games:items.length,questions:0,pending:0};return `<div class="queue-date"><strong>${esc(dateKey)}</strong><small>${items.length}/${stats.games}局 · 疑问 ${stats.questions} · 待复核 ${stats.pending}</small></div>`+items.map(e=>{const c=issueCounts(e),days=queueIssueDays(e);return `<div class="queue-item ${current?.entry.bvid===e.bvid?'active':''}" role="button" tabindex="0" data-game="${esc(e.bvid)}"><strong>第${esc(e.game_number)}局</strong>${esc(e.board_name)} ${e.protected?'<span class="badge">保护样例</span>':''}<br>${humanBadge(e._mine_status)} <span class="badge">AI发现 ${e.decision_count||0}</span>${c.questions?` <span class="badge issue">投票疑问 ${c.questions}</span>`:''}${c.pending?` <span class="badge issue">待复核 ${c.pending}</span>`:''}${e._has_other?'<span class="badge">有他人意见</span>':''}${days.length?`<br><small>${esc(days.join(' · '))}</small>`:''}<br><small>${esc(e.bvid)}</small></div>`}).join('')}).join('')||'<div class="empty">没有符合筛选条件的对局。</div>'}
async function decodeGame(bvid){if(gameCache.has(bvid))return gameCache.get(bvid);const binary=atob(data.game_blobs[bvid]);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const game=JSON.parse(text);gameCache.set(bvid,game);if(gameCache.size>3)gameCache.delete(gameCache.keys().next().value);return game}
async function loadGame(bvid){if(!data.game_blobs[bvid])return;const token=++loadToken;message('正在展开本局资料……');try{const g=await decodeGame(bvid);if(token!==loadToken)return;current=g;fullSource=false;location.hash=bvid;renderGame();renderQueue();message('')}catch(e){message('本局载入失败：'+e.message,true)}}
function seat(n){if(n==null)return '未说明';const s=current.dossier.seats.find(s=>s.seat===Number(n));return `${n}号${s?.name?' '+s.name:''}${s?.role?' · '+s.role:''}`}

function votingTargetLabel(target){const b=current.voting?.ballots?.find(b=>b.id===target);return b?`${{sheriff:'警徽票',exile:'放逐票',unknown:'类型待核'}[b.kind]}第${b.number}轮`:''}

function votingReviewHtml(){const r=current.voting_review;if(!r)return '';const questions=Array.isArray(r.questions)?r.questions:[],days=Array.isArray(r.days)?r.days:[],checks=Array.isArray(r.video_checks)?r.video_checks:[],changes=Array.isArray(r.accepted_changes)?r.accepted_changes:[],questionCount=Number(r.question_count)||questions.filter(q=>q.severity!=='pending').length,pendingCount=Number(r.pending_count)||questions.filter(q=>q.severity==='pending').length;const questionCard=(q,i)=>{const id=String(q.id||`voting-question-${i+1}`),opinion=entryFor(current.entry.bvid).question_opinions[id]||{},target=q.target==null?'':votingTargetLabel(q.target),pending=q.severity==='pending',n=dayNumber(q.day);return `<details class="voting-question ${pending?'pending':''}"><summary><span class="badge issue">${pending?'待补录 / 复核':'有疑问'}</span> ${esc(q.title||q.code||id)} · ${esc(dayLabel(q.day))}${target?` · ${esc(target)}`:''}</summary><p class="pre">${esc(q.reason||'未提供说明')}</p>${n?`<button class="small" data-day-jump="${n}">跳至本局第${n}天投票</button>`:''}${(Array.isArray(q.evidence)?q.evidence:[]).map(evidenceHtml).join('')}<div class="opinion"><strong>人工复核意见</strong><br>${selectJudge(opinion.judgement,`data-question-judge="${esc(id)}"`)}<textarea data-question-note="${esc(id)}" placeholder="记录人工判断、建议及依据。">${esc(opinion.comment||'')}</textarea></div></details>`};let out=`<div class="voting-review"><p class="muted">以下是机器整理的核对线索，打开原视频或看到AI检查记录都不会自动记为人工核实。人工意见请在每项中填写。</p><div class="metrics"><span class="badge issue">疑问 ${questionCount}</span><span class="badge issue">待补录 / 复核 ${pendingCount}</span><span class="badge ${r.human_reviewed?'good':'issue'}">人工核实：${r.human_reviewed?'已标记':'尚未标记'}</span></div>${days.length?`<h3>按游戏日定位</h3><div class="toolbar">${days.map(d=>{const n=dayNumber(d.day),label=dayLabel(d.day);return `<button class="small" ${n?`data-day-jump="${n}"`:''} ${n?'':'disabled'}>${label} · 疑问 ${Number(d.question_count)||0} / 待复核 ${Number(d.pending_count)||0}</button>`}). function renderSource(ms=null){const needle=$('source-search')?.value.trim()||'',rows=(fullSource?current.full_transcript:current.recap_segments).filter(s=>!needle||s.text.includes(needle));$('source-count').textContent=`${fullSource?'全文':'复盘'} · 显示 ${rows.length} 段`;$('source-rows').innerHTML=rows.map((s,i)=>`<tr data-source-ms="${s.start_ms}" id="src-${i}"><td>${time(s.start_ms)}–${time(s.end_ms)}</td><td>${esc(s.text)}</td></tr>`).join('');if(ms!=null&&rows.length){let nearest=0;for(let i=1;i<rows.length;i++)if(Math.abs(rows[i].start_ms-ms)<Math.abs(rows[nearest].start_ms-ms))nearest=i;const row=$('src-'+nearest);row.classList.add('source-hit');row.scrollIntoView({block:'center'})}}

function download(name,text,mime='application/json'){const url=URL.createObjectURL(new Blob([text],{type:mime})),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}

function exportMine(){const entries=Object.values(state.entries).filter(useful);if(!entries.length)return message('请先填写至少一项复核意见。',true);if(!$('reviewer').value.trim()){$('reviewer').focus();return message('请填写复核人姓名或代号，便于汇总。',true)}state.reviewer_name=$('reviewer').value.trim();persist();const result={format:'s22-review-feedback-v1',snapshot_id:data.snapshot_id,dataset_generated_at:data.generated_at,reviewer_id:state.reviewer_id,reviewer_name:state.reviewer_name,exported_at:new Date().toISOString(),entries};download(`S22_复核意见_${state.reviewer_name.replace(/[\\/:*?"<>|]/g,'_')}_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(result,null,2));message(`已导出 ${entries.length} 局意见，请把JSON文件交回汇总。`)}
function validateFeedback(report){if(report.format!=='s22-review-feedback-v1'||report.snapshot_id!==data.snapshot_id)throw new Error('意见文件不属于此版资料，请使用同一份离线HTML核对。');if(typeof report.reviewer_id!=='string'||typeof report.reviewer_name!=='string'||!Array.isArray(report.entries)||report.entries.length>data.index.length)throw new Error('意见文件格式不完整。');const ids=new Set();for(const e of report.entries){const base=data.index.find(g=>g.bvid===e.bvid);if(!base||base.dossier_sha256!==e.base_sha256||ids.has(e.bvid)||!Object.hasOwn(judgeLabels,e.status))throw new Error('意见中的对局或资料版本不匹配。');ids.add(e.bvid);if(typeof e.comment!=='string'||!e.question_opinions||typeof e.question_opinions!=='object'||Array.isArray(e.question_opinions)||!e.field_opinions||typeof e.field_opinions!=='object'||Array.isArray(e.field_opinions))throw new Error('意见内容格式不完整。');for(const q of Object.values(e.question_opinions))if(!q||!Object.hasOwn(judgeLabels,q.judgement||'unreviewed')||typeof(q.comment||'')!=='string')throw new Error('逐项意见格式不正确。');for(const text of Object.values(e.field_opinions))if(typeof text!=='string')throw new Error('字段意见格式不正确。')}return report}
async function importFile(file){if(!file)return;if(file.size>20*1024*1024)return message('请选择导出的复核JSON文件。',true);try{const report=validateFeedback(JSON.parse(await file.text()));const old=state.imports.findIndex(x=>x.reviewer_id===report.reviewer_id);if(old>=0)state.imports[old]=report;else state.imports.push(report);persist();if(current)renderGame();modal('意见已导入',`<p>复核人：<strong>${esc(report.reviewer_name)}</strong>，共 ${report.entries.length} 局。可以逐局查看并比较意见。</p><p>如果这是你此前导出的进度，可恢复后继续填写。</p><button id="resume-import" class="primary">恢复为我的复核进度</button>`);$('resume-import').onclick=()=>{if(Object.values(state.entries).some(useful)&&!confirm('将先保留当前意见副本，再载入这份进度继续复核。确定继续？'))return;if(Object.values(state.entries).some(useful)){state.imports.push({format:'s22-review-feedback-v1',snapshot_id:data.snapshot_id,reviewer_id:uid(),reviewer_name:state.reviewer_name+'（恢复前副本）',exported_at:new Date().toISOString(),entries:clone(Object.values(state.entries))})}state.reviewer_id=report.reviewer_id;state.reviewer_name=report.reviewer_name;state.entries=Object.fromEntries(report.entries.map(e=>[e.bvid,clone(e)]));state.imports=state.imports.filter(x=>x.reviewer_id!==report.reviewer_id);$('reviewer').value=state.reviewer_name;persist();if(current)renderGame();$('modal').close();message('已恢复这份复核进度，可以继续填写。')}}catch(e){message('导入失败：'+e.message,true)}finally{$('import-file').value=''}}
function showHelp(){const c=data.counts;modal('如何共享与汇总',`<ol class="help"><li>发送这一个HTML文件给其他人，双击打开即可。文件内已包含${c.games}局对局、全部转写、${c.decisions}项AI推理及${c.images}张姓名牌及投票证据截图。</li><li>填写姓名或代号，可用日期、版型或BV号筛选分工。对每局、AI结论、座位或逐轮事件填写意见。</li><li>填写后点击“导出我的意见”，把得到的JSON文件交回；接收人可用“导入意见”逐局比较。</li><li>意见会在当前浏览器暂存；HTML文件本身不会被改写。换设备或分享意见时，请携带导出的JSON文件。</li><li>多人各自核对，不会自动同步。本文件不会连接或改写项目数据库。</li><li>文字和截图可离线查看；音视频未内嵌，“打开原视频”按需访问哔哩哔哩。</li></ol>`)}
$('help').onclick=showHelp;$('close-modal').onclick=()=>{$('modal').close();lastFocus?.focus?.()};
$('queue').onclick=e=>{const row=e.target.closest('[data-game]');if(row)loadGame(row.dataset.game)};
$('queue').onkeydown=e=>{if(e.key==='Enter'){const row=e.target.closest('[data-game]');if(row)loadGame(row.dataset.game)}};
$('search').oninput=renderQueue;$('filter').onchange=renderQueue;$('date-filter').onchange=()=>{refreshVotingFilters();renderQueue()};$('day-filter').onchange=renderQueue;
$('reviewer').oninput=()=>{state.reviewer_name=$('reviewer').value.trim();persist()};
$('export').onclick=exportMine;$('import').onclick=()=>$('import-file').click();$('import-file').onchange=e=>importFile(e.target.files[0]);
$('rules').onclick=()=>{modal('S22 版型规则与夜间顺序','<pre id="rule-text"></pre>');$('rule-text').textContent=data.rules};
$('content').addEventListener('input',e=>{const el=e.target;if(el.id==='source-search')return renderSource();if(el.matches('[data-game-note]'))draft().comment=el.value;else if(el.dataset.questionNote){const row=draft();row.question_opinions[el.dataset.questionNote]={...(row.question_opinions[el.dataset.questionNote]||{}),comment:el.value}}else if(el.dataset.fieldNote)draft().field_opinions[el.dataset.fieldNote]=el.value;else return;persist()});
$('content').addEventListener('change',e=>{const el=e.target;if(el.id==='show-unknown'){showUnknown=el.checked;renderGame();return}if(el.matches('[data-game-judge]'))draft().status=el.value;else if(el.dataset.questionJudge){const row=draft();row.question_opinions[el.dataset.questionJudge]={...(row.question_opinions[el.dataset.questionJudge]||{}),judgement:el.value}}else return;persist()});
$('content').addEventListener('click',e=>{const dayJump=e.target.closest('[data-day-jump]');if(dayJump){const row=$(dayAnchor(dayJump.dataset.dayJump));if(row){document.querySelectorAll('.day-jump.source-hit').forEach(x=>x.classList.remove('source-hit'));row.classList.add('source-hit');row.scrollIntoView({block:'center'})}else message('本局未提供该游戏日的投票表行。',true);return}const frame=e.target.closest('[data-frame]');if(frame){modal('原始截图 · '+frame.dataset.frameTitle,'<img id="frame-image" alt="原始截图">');$('frame-image').src=data.images[frame.dataset.frame];return}const seekButton=e.target.closest('[data-seek]');if(seekButton)return seek(Number(seekButton.dataset.seek));const action=e.target.closest('[data-action]')?.dataset.action;if(action==='next-game'){const ids=[...$('queue').querySelectorAll('[data-game]')].map(e=>e.dataset.game),i=ids.indexOf(current.entry.bvid);if(i>=0&&i+1<ids.length)loadGame(ids[i+1]);else if(i<0&&ids.length)loadGame(ids[0]);else message('当前筛选已到最后一局。')}if(action==='show-source'||action==='full-source'){fullSource=true;$('source-panel').open=true;renderSource();if(action==='show-source')$('source-panel').scrollIntoView({block:'start'})}if(action==='recap-source'){fullSource=false;renderSource()}if(action==='download-transcript')download(current.entry.bvid+'_全文转写.txt',current.full_transcript.map(s=>`[${time(s.start_ms)}–${time(s.end_ms)}] ${s.text}`).join('\n'),'text/plain;charset=utf-8')});
async function boot(){try{if(typeof DecompressionStream==='undefined')throw new Error('请使用较新版本的Edge或Chrome打开此文件。');data=JSON.parse($('embedded').textContent);$('embedded').remove();if(data.format!=='s22-offline-review-v1')throw new Error('资料格式不匹配');$('filter').options[0].textContent=`全部${data.counts.games}局`;storageKey='s22_offline_feedback_'+data.snapshot_id;state=storageRead()||{reviewer_id:uid(),reviewer_name:'',entries:{},imports:[]};$('reviewer').value=state.reviewer_name;for(const id of ['export','import','rules','reviewer','search','filter','date-filter','day-filter'])$(id).disabled=false;refreshVotingFilters();updateProgress();renderQueue();const id=location.hash.slice(1);await loadGame(data.game_blobs[id]?id:data.index[0].bvid)}catch(e){$('content').innerHTML='<div class="card"><h2>离线资料打开失败</h2><p>'+esc(e.message)+'</p></div>';message(e.message,true)}}
boot();
</script></body></html>
