<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S23 正赛逐局推导与复核</title>
<style>
.card,footer{overflow-wrap:anywhere}
:root{--ink:#153746;--muted:#617785;--line:#d9e4e9;--blue:#126584;--green:#237254;--orange:#956016}*{box-sizing:border-box}body{margin:0;background:#f1f5f7;color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #b8cbd3;border-radius:6px;padding:7px 12px;color:var(--ink)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}a{color:var(--blue)}header{background:#143b4d;color:white;padding:20px 25px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}header p{margin:4px 0;color:#d2e4ec}.actions{display:flex;gap:8px;flex-wrap:wrap}.bar{padding:12px 24px;background:white;border-bottom:1px solid var(--line);display:flex;gap:15px;align-items:center;flex-wrap:wrap}.bar input{width:180px}input,select,textarea{padding:8px;border:1px solid #bbced6;border-radius:5px;background:white;color:var(--ink)}textarea{width:100%;min-height:75px;resize:vertical}.layout{display:grid;grid-template-columns:290px minmax(0,1fr)}aside{height:calc(100vh - 182px);position:sticky;top:0;overflow:auto;background:white;border-right:1px solid var(--line);padding:16px}aside input,aside select{width:100%;margin-bottom:9px}.game-link{width:100%;display:block;text-align:left;margin:8px 0;padding:10px;border-color:var(--line);font-size:13px}.game-link strong{display:block;font-size:14px}.game-link.selected{background:#e3f0f5;border-color:var(--blue)}main{padding:24px;max-width:1350px;min-width:0}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:19px;margin:0 0 18px}h2{font-size:23px;margin:0 0 8px}h3{font-size:18px;margin:0 0 12px}h4{margin:10px 0 6px}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;border-radius:4px;background:#e8f2f5;padding:2px 8px;margin-right:5px;font-size:12px}.pending{color:var(--orange);background:#fff4dc}.good{color:var(--green);background:#e7f4ed}.facts{display:flex;flex-wrap:wrap;gap:10px 24px}.seat-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.seat{padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin-top:8px}.seat strong{font-size:16px}.seat small{display:block;color:var(--muted)}.timeline{border-left:3px solid #b4cedb;padding-left:17px}.phase-title{font-weight:700;margin:16px 0 8px}.event{padding:7px 10px;border-bottom:1px solid #e8eef1}.event.unknown{color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;text-align:left;border:1px solid var(--line);vertical-align:top}.table-scroll{overflow:auto}blockquote{margin:10px 0;padding:10px 13px;background:#f4f7f8;border-left:3px solid #82a9bd;white-space:pre-wrap;font-size:14px}.question{border:1px solid #e7d2a8;background:#fffbf3;border-radius:7px;padding:15px;margin:12px 0}.question label{display:block}.evidence button{padding:3px 8px;font-size:12px}.frame{width:100%;height:auto;border-radius:6px}.transcript{max-height:600px;overflow:auto}.cue{border-bottom:1px solid #e4ecef;padding:6px 0}.cue button{padding:2px 6px;font-size:12px;margin-right:10px}.cue mark{background:#ffedaf}.feedback{display:grid;grid-template-columns:1fr 2fr;gap:12px}.notice{padding:10px 24px;background:#fff0ce;color:#775022}audio{width:100%;margin:10px 0}details{margin:8px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.small{font-size:12px}#status{min-height:20px}footer{padding:20px;color:var(--muted);font-size:13px}@media(max-width:950px){.layout{grid-template-columns:220px minmax(0,1fr)}.seat-columns{grid-template-columns:1fr}main{padding:15px}.feedback{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}aside{position:relative;height:auto;max-height:260px;border-bottom:1px solid var(--line)}header{padding:16px}.bar{padding:12px}main{padding:10px}h1{font-size:21px}}
.phase-finding{padding:8px 10px;border-left:3px solid #a8bdc5}.phase-finding.question{border-left:4px solid #bc781b}.vote-control{padding:12px 15px;margin:14px 0;background:#eaf4ee;border:1px solid #bfd8c7;border-radius:6px}.event.unknown{color:#8b5b13;background:#fff8e9}
</style></head><body>
<header><div><h1>S23 正赛逐局推导与复核</h1><p id="summary"></p></div><div class="actions"><button id="export">导出我的复核意见</button><button id="import">导入复核意见</button><input id="file" type="file" accept="application/json" hidden></div></header>
<div class="bar"><label>复核人 <input id="reviewer" placeholder="姓名或代号"></label><span id="status" class="muted"></span></div>
<div class="notice">逐日依据最终复盘核对，疑点结合完整转写交叉确认；时间戳转写仅展示最终复盘。需你亲自核对的遗留项标在对应日夜。<a href="S23_资料未公开清单.csv" target="_blank" rel="noopener">查看资料未公开清单</a>，也可在左侧筛选“含资料未公开事项”。盗宝大师首夜无狼刀。AI核对与用户确认分别保留，复核意见暂存于当前浏览器。</div>
<div class="layout"><aside><input id="search" type="search" placeholder="日期、版型、姓名、BV号"><select id="filter"><option value="all">全部正赛</option><option value="human">需要你亲自核对</option><option value="unpublished">含资料未公开事项</option><option value="unreviewed">我尚未确认</option><option value="accepted">我已确认</option></select><div id="list"></div></aside><main id="game"></main></div>
<footer id="footer"></footer>
