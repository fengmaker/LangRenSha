<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__SEASON__ 逐局复核</title><style>

e:13px}tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}.seat-number{width:70px;color:#6f8797;font-variant-numeric:tabular-nums}.faction{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;margin-right:8px}.good{background:#edf5fa;color:#246a90}.wolf{background:#fceeee;color:#a94b4b}.flow th{width:132px;white-space:nowrap;font-size:13px;font-weight:600;color:#567586;vertical-align:top}.flow td{line-height:1.8}.votes{min-width:760px}.votes th,.votes td{text-align:center;padding:11px 7px}.votes thead th:first-child,.votes tbody th{width:82px;white-space:nowrap}.votes .vote-result{min-width:148px;text-align:left;color:#2f5970;font-size:13px}.empty-vote{color:#c4cfd7}.table-note{font-size:12px;color:var(--muted);margin:11px 0 0}details.card summary{cursor:pointer;font-size:18px;font-weight:700}details.card summary .muted{font-weight:400;font-size:12px;margin-left:12px}.recap{list-style:none;margin:18px 0 0;padding:0}.recap li{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding:5px 0;font-size:14px}.recap time{font-variant-numeric:tabular-nums;color:#8a9ca8;font-size:12px}.review-controls{border-top:3px solid #66a3c3}.reviewed{display:flex;gap:9px;align-items:center;font-size:14px;margin-bottom:12px}.reviewed input{width:17px;height:17px;accent-color:var(--blue)}textarea{width:100%;display:block;min-height:126px;resize:vertical;border:1px solid #bccfdd;border-radius:5px;padding:12px;color:var(--ink);background:white;line-height:1.65}#status{display:block;min-height:1.5em;margin-top:10px;color:#608297;font-size:12px}.review-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px}.review-footer .button{flex-shrink:0}dialog{border:0;border-radius:7px;padding:12px;max-width:96vw;max-height:96vh;background:white}dialog::backdrop{background:#09131bd9}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px}dialog img{display:block;max-widt .seats td small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
